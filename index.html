<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="main-title">Welcome to the JavaScript DOM Lab</h1>

  <p id="description">This paragraph will be updated using JavaScript.</p>

  <input type="text" id="name-input" placeholder="Enter your name">
  <button id="greet-btn">Greet Me</button>
  <p id="greeting"></p>

  <button id="highlight-btn">Highlight Title</button>
  <button id="reset-btn">Reset</button>
  <button id="color-btn">Random Background Color</button>

  <h2>Add to List</h2>
  <input type="text" id="list-item-input" placeholder="New list item">
  <button id="add-item-btn">Add Item</button>
  <button id="remove-item-btn">Remove Last Item</button>
  <ul id="item-list"></ul>

  <button id="dark-mode-btn">Toggle Dark Mode</button>

  <hr>
  <h2>Account Balance</h2>
  <p id="balance-display">Current Balance: $<span id="balance">0.00</span></p>

  <input type="number" id="amount-input" placeholder="Enter amount">
  <button id="deposit-btn">Deposit</button>
  <button id="withdraw-btn">Withdraw</button> <br>
  <p id="alert"></p>

  <script src="script.js"></script>
</body>
</html>
